name: Build OTTOZ APK

# Se lance uniquement quand on clique sur "Run workflow" dans l'onglet Actions
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Mots de passe et alias du certificat de signature de l'app.
      # Pour un projet perso non publié sur le Play Store, des valeurs fixes suffisent.
      BUBBLEWRAP_KEYSTORE_PASSWORD: ottoz-shirley-2026
      BUBBLEWRAP_KEY_PASSWORD: ottoz-shirley-2026
      KEY_ALIAS: ottoz

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Indiquer à Bubblewrap où trouver Java et le SDK Android
        run: printf "n\n${JAVA_HOME}\nn\n${ANDROID_HOME}\n" | bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Créer le certificat de signature à l'avance
        # On crée nous-mêmes le fichier de signature, avec un mot de passe et un alias connus.
        # Bubblewrap détectera ce fichier existant et n'aura pas besoin de le créer lui-même
        # (ce qui évite la partie la plus imprévisible du processus interactif).
        run: |
          mkdir -p android-project
          keytool -genkeypair -v -keystore android-project/android.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" -dname "CN=OTTOZ, OU=Shirley Games, O=Shirley Games, L=Paris, S=Paris, C=FR"

      - name: Initialiser le projet Android
        # Répond automatiquement aux questions posées par bubblewrap init :
        # JDK/SDK (déjà installés), une douzaine de valeurs par défaut (nom, url, couleurs...),
        # puis l'alias et les mots de passe du certificat qu'on vient de créer.
        run: printf "n\n${JAVA_HOME}\nn\n${ANDROID_HOME}\n\n\n\n\n\n\n\n\n\n\n\n\n${KEY_ALIAS}\n${BUBBLEWRAP_KEYSTORE_PASSWORD}\n${BUBBLEWRAP_KEY_PASSWORD}\n\n\n\n\n\n" | bubblewrap init --manifest="https://sig229.github.io/OTTOZ_GAME/manifest.json" --directory="android-project" --skipPwaValidation

      - name: Construire l'APK signé
        working-directory: android-project
        run: printf "n\n${JAVA_HOME}\nn\n${ANDROID_HOME}\n" | bubblewrap build --skipPwaValidation

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: OTTOZ-apk
          path: android-project/app-release-signed.apk
