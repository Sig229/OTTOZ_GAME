name: Build OTTOZ APK

# Se lance uniquement quand on clique sur "Run workflow" dans l'onglet Actions
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Mots de passe du certificat de signature de l'app.
      # Pour un projet perso non publié sur le Play Store, des valeurs fixes suffisent.
      BUBBLEWRAP_KEYSTORE_PASSWORD: ottoz-shirley-2026
      BUBBLEWRAP_KEY_PASSWORD: ottoz-shirley-2026

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Indiquer à Bubblewrap où trouver Java et le SDK Android
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Initialiser le projet Android (première tentative automatisée)
        # Cette ligne répond automatiquement aux questions posées par bubblewrap init.
        # Si le build échoue, on regardera le log pour voir à quelle question
        # la réponse ne correspondait pas, et on ajustera cette liste.
        run: printf 'n\n\n\n\n\n\n\n\n\n\n\ny\nOTTOZ\nShirley Games\nShirley Games\nParis\nParis\nFR\nyes\n' | bubblewrap init --manifest="https://sig229.github.io/OTTOZ_GAME/manifest.json" --directory="android-project" --skipPwaValidation || true

      - name: Construire l'APK signé
        working-directory: android-project
        run: bubblewrap build --skipPwaValidation

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: OTTOZ-apk
          path: android-project/app-release-signed.apk
